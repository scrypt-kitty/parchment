ShortDescription: A fast, private, open-source Markdown viewer
Description: |-
  Parchment opens a Markdown file and renders it. No editor, no account, no sync,
  no telemetry. It renders GitHub-flavored Markdown with GitHub's typography in
  light and dark, reloads when the file changes on disk, and offers in-document
  search, a table of contents, zoom, HTML export, and printing.

  The only network request it makes is a once-daily check for a newer release,
  which can be switched off.
