name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Monday 07:00 UTC. Advisories are published against code that has not
    # changed, so this has to run on a clock, not only on commits.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Anything that ships inside the app is held to a stricter bar than the
      # build tooling: a vulnerable dev server is a developer's problem, a
      # vulnerable Markdown parser is every user's problem.
      - name: Audit shipped dependencies (fail on moderate)
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit build tooling (fail on high)
        run: npm audit --audit-level=high

  cargo-audit:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: audit
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # Default strictness: real vulnerabilities fail, informational notices
      # about unmaintained transitive crates do not. `--deny warnings` would
      # fail on 17 crates inside Tauri's own tree that this project cannot fix.
      - name: RustSec advisory database
        run: cargo audit --file src-tauri/Cargo.lock
      - name: Licences, bans, and sources
        run: cargo deny --manifest-path src-tauri/Cargo.toml check

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
