name: Bump version

# The version lives in three files that must agree — package.json,
# src-tauri/tauri.conf.json, and src-tauri/Cargo.toml (plus Cargo.lock). Bumping
# them by hand is exactly the kind of thing that gets half-done, so this does it
# and opens a PR.
#
# A PR rather than a direct push, because main requires status checks: the bump
# gets the same gate as any other change, and the tag is only ever created from
# a commit CI has already approved.
#
# This needs "Allow GitHub Actions to create and approve pull requests" enabled
# in Settings > Actions > General. GitHub bundles creation and approval into one
# toggle, so it is worth being clear about the approval half: nothing in this
# repository self-approves — the auto-merge workflow deliberately does not — and
# main gates on status checks rather than reviews, so an approval from Actions
# would not unblock anything on its own.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        required: true
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Compute and apply the new version
        id: version
        run: |
          set -euo pipefail
          current=$(node -p "require('./package.json').version")
          next=$(node -e "
            const [maj, min, patch] = process.argv[1].split('.').map(Number);
            const kind = process.argv[2];
            const bumped = kind === 'major' ? [maj + 1, 0, 0]
                         : kind === 'minor' ? [maj, min + 1, 0]
                         : [maj, min, patch + 1];
            console.log(bumped.join('.'));
          " "$current" "${{ inputs.bump }}")

          echo "Bumping $current -> $next"
          node -e "
            const fs = require('fs');
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const json = JSON.parse(fs.readFileSync(file, 'utf8'));
              json.version = process.argv[1];
              fs.writeFileSync(file, JSON.stringify(json, null, 2) + '\n');
            }
          " "$next"

          # Only the [package] version, not any dependency pinned to the same string.
          perl -0pi -e "s/^version = \"$current\"/version = \"$next\"/m" src-tauri/Cargo.toml
          cargo update -p parchment --manifest-path src-tauri/Cargo.toml

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Verify all four files agree
        run: ./scripts/check-versions.sh

      - uses: peter-evans/create-pull-request@v8
        with:
          branch: release/v${{ steps.version.outputs.next }}
          title: Release v${{ steps.version.outputs.next }}
          commit-message: |
            Bump version to ${{ steps.version.outputs.next }}

            Generated by the bump-version workflow.
          body: |
            Version bump ${{ steps.version.outputs.current }} → **${{ steps.version.outputs.next }}**,
            applied across `package.json`, `src-tauri/tauri.conf.json`,
            `src-tauri/Cargo.toml`, and `Cargo.lock`.

            Merge this once checks pass, then publish:

            ```sh
            git checkout main && git pull
            git tag -a v${{ steps.version.outputs.next }} -m "Parchment ${{ steps.version.outputs.next }}"
            git push origin v${{ steps.version.outputs.next }}
            ```

            The tag triggers the Release workflow, which refuses to build if the
            tag and the committed version disagree.
