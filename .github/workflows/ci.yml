name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Types and renderer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

      # Thresholds live in the `test:coverage` script, so the gate is identical
      # here and on a contributor's machine.
      - name: Tests with coverage thresholds
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  rust:
    name: Rust ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            label: Linux
          - platform: macos-latest
            label: macOS
          - platform: windows-latest
            label: Windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ci-${{ matrix.platform }}

      # tauri.conf.json points frontendDist at dist/, which must exist before
      # the build script will run.
      - run: npm ci && npm run build

      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
        if: matrix.platform == 'ubuntu-22.04'

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
