name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            label: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            label: Windows (x64)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            label: Linux (x64)

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Verify the renderer before shipping a build
        run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: the APPLE_* signing variables are deliberately absent.
          # tauri-action treats them as "sign this build" whenever they are
          # defined at all — even as empty strings — and then dies on
          # `security import` with no certificate to import. Releases are
          # unsigned (see the README); to start signing, add the six APPLE_*
          # secrets to the repository and reinstate them here in one block.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Parchment ${{ github.ref_name }}
          # Published directly rather than left as a draft, so a tag produces a
          # release people can actually download.
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ### Downloads

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Windows | `*_x64-setup.exe` (installer) or `*_x64_en-US.msi` |
            | Linux | `*_amd64.AppImage` (portable) or `*_amd64.deb` |

            These builds are **unsigned**. macOS and Windows will warn on first
            launch; the README explains how to get past it in one step.
          args: ${{ matrix.args }}
