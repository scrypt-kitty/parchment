name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
            label: macOS (Intel)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
            label: Windows (x64)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
            label: Linux (x64)

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      # Refuse to build if the tag and the committed version disagree — that
      # produces installers whose metadata contradicts the release they sit under.
      - name: Tag matches committed version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # the matrix includes Windows, where the default is pwsh
        run: ./scripts/check-versions.sh "${{ github.ref_name }}"

      - run: npm ci

      - name: Verify the renderer before shipping a build
        run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: the APPLE_* signing variables are deliberately absent.
          # tauri-action treats them as "sign this build" whenever they are
          # defined at all — even as empty strings — and then dies on
          # `security import` with no certificate to import. Releases are
          # unsigned (see the README); to start signing, add the six APPLE_*
          # secrets to the repository and reinstate them here in one block.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Parchment ${{ github.ref_name }}
          # Published directly rather than left as a draft, so a tag produces a
          # release people can actually download.
          releaseDraft: false
          prerelease: false
          releaseBody: |
            ### Downloads

            | Platform | File |
            |---|---|
            | macOS (Apple Silicon) | `*_aarch64.dmg` |
            | macOS (Intel) | `*_x64.dmg` |
            | Windows | `*_x64-setup.exe` (installer) or `*_x64_en-US.msi` |
            | Linux | `*_amd64.AppImage` (portable) or `*_amd64.deb` |

            These builds are **unsigned**. macOS and Windows will warn on first
            launch; the README explains how to get past it in one step.

            ### Verifying your download

            `SHA256SUMS` is attached below, and every artifact carries a signed
            build provenance attestation. See the README for how to check both.
          args: ${{ matrix.args }}

  checksums:
    name: Checksums and provenance
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Collect the published artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --dir artifacts --pattern '*'
          ls -la artifacts

      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          # Written to the parent directory so the checksum file can never end
          # up listing itself.
          (cd artifacts && sha256sum -- * > ../SHA256SUMS)
          cat SHA256SUMS

      # Ties each artifact to the workflow, commit, and runner that produced it.
      # A checksum file published by the same pipeline that built the binaries
      # proves they arrived intact, not that the pipeline was honest; this is
      # what covers the second case.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*

      - name: Attach SHA256SUMS to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" SHA256SUMS \
            --repo "${{ github.repository }}" --clobber
