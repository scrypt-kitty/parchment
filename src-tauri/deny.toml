# cargo-deny configuration. Run locally with:
#   cargo deny --manifest-path src-tauri/Cargo.toml check

[graph]
all-features = false

[advisories]
# Vulnerabilities and yanked crates fail the build, always.
#
# `unmaintained = "workspace"` scopes the unmaintained check to dependencies
# this project actually chooses. Every unmaintained crate in the tree today is
# transitive through Tauri — the gtk-rs GTK3 bindings behind the Linux webview,
# `unic-*` under tauri-codegen, `proc-macro-error` — and none can be fixed here
# by bumping a version. Failing on them would mean a permanently red pipeline
# that everyone learns to ignore, which is worse than not checking.
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
# Permissive licences only. A copyleft dependency creeping into a shipped
# desktop binary is a licensing problem, not a style preference.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
  "OpenSSL",
]
confidence-threshold = 0.8

# Parchment itself is GPL-3.0-or-later. The allow-list above governs
# *dependencies* — a copyleft dependency would still be a problem, because it
# would constrain how the combined work can be relicensed later.
[[licenses.exceptions]]
name = "parchment"
allow = ["GPL-3.0-or-later"]

[bans]
# Duplicate major versions bloat the binary and multiply the patch surface,
# but Tauri's tree legitimately carries a few, so this warns rather than fails.
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
# Nothing should come from anywhere but crates.io. A git dependency is how a
# supply-chain swap slips in unnoticed.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
