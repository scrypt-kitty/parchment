[package]
name = "parchment"
version = "1.0.1"
description = "A fast, private, open-source Markdown viewer for macOS, Windows, and Linux"
authors = ["Parchment contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/scrypt-kitty/parchment"
edition = "2021"
rust-version = "1.77"

[lib]
name = "parchment_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No `protocol-asset`: images are served by the private `mdasset` scheme in
# src/assets.rs, which scopes every read to the open document's directory.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
percent-encoding = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
